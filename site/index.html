<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <meta name="description" content="An index of my projects, rebuilt every day from GitHub.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1a17'/%3E%3Crect x='9' y='8' width='14' height='3' fill='%23e4572e'/%3E%3Crect x='9' y='14.5' width='14' height='3' fill='%23f3eee4'/%3E%3Crect x='9' y='21' width='9' height='3' fill='%23f3eee4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">
        <a class="owner" id="owner" href="#">
          <img class="avatar" id="avatar" alt="" width="28" height="28" hidden>
          <span id="owner-name"></span>
        </a>
        <span class="eyebrow-sep" aria-hidden="true">/</span>
        <span>Index</span>
      </p>
      <h1 class="title" id="title">Projects</h1>
      <p class="tagline" id="tagline"></p>
      <dl class="stats" id="stats"></dl>
    </header>

    <nav class="controls" aria-label="Project views">
      <div class="views" role="group" aria-label="View">
        <button type="button" class="view" data-view="featured" aria-pressed="false">Featured <span class="count"></span></button>
        <button type="button" class="view" data-view="all" aria-pressed="false">All <span class="count"></span></button>
        <button type="button" class="view" data-view="pinned" aria-pressed="false">Pinned <span class="count"></span></button>
      </div>
      <div class="tools">
        <label class="search">
          <span class="visually-hidden">Search projects</span>
          <input type="search" id="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
        <label class="sort">
          <span class="visually-hidden">Sort</span>
          <select id="sort">
            <option value="recent">Recently updated</option>
            <option value="stale">Longest untouched</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
      </div>
      <div class="topics" id="topics" role="group" aria-label="Filter by topic"></div>
    </nav>

    <main id="main">
      <p class="status" id="status" role="status">Loading projects…</p>
      <section class="featured" id="featured-list" aria-label="Featured projects" hidden></section>
      <ol class="index" id="index-list" aria-label="All projects" hidden></ol>
      <p class="hint" id="pin-hint" hidden>Pins are saved in this browser only. Nobody else sees them.</p>
    </main>

    <footer class="colophon">
      <p>Rebuilt from GitHub <span id="generated"></span>.</p>
      <p><a href="https://github.com/learner-agent-sudo/portal">How this page works</a></p>
    </footer>
  </div>

  <noscript><p class="status">This page needs JavaScript to list the projects.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
