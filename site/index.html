<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <meta name="description" content="An index of my projects, rebuilt every day from GitHub.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060913" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f3bd6'/%3E%3Crect x='7' y='8' width='18' height='12' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='10.5' cy='11.5' r='1' fill='white'/%3E%3Crect x='11' y='23' width='10' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply a saved Light/Dark choice before the stylesheet paints (no flash).
    // "Auto" leaves data-theme off so the CSS follows the device setting.
    try {
      var t = localStorage.getItem('portal:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
    var r = document.documentElement;
    r.dataset.scheme = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to projects</a>

  <div class="page">
    <header class="hero">
      <div class="hero-text">
        <div class="hero-top reveal">
          <a class="owner" id="owner" href="#">
            <span class="owner-pic" aria-hidden="true">
              <span class="owner-mono" id="owner-mono"></span>
              <img class="avatar" id="avatar" alt="" width="28" height="28" hidden>
            </span>
            <span class="owner-name" id="owner-name"></span>
            <svg class="owner-arrow" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 17 17 7M8.5 7H17v8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Theme: Auto (follows your device). Switch to Light" title="Theme: Auto (follows your device). Switch to Light">
            <span class="theme-icon" id="theme-icon" aria-hidden="true"></span>
            <span class="theme-label" id="theme-label">Auto</span>
          </button>
        </div>
        <h1 class="title reveal"><span id="title">Projects</span><span class="title-count" id="title-count" aria-hidden="true"></span></h1>
        <p class="tagline reveal" id="tagline"></p>
        <dl class="stats reveal" id="stats"></dl>
      </div>
      <div class="collage" id="collage" aria-hidden="true"></div>
    </header>

    <nav class="controls" aria-label="Project views">
      <div class="views" role="group" aria-label="View">
        <button type="button" class="view" data-view="featured" aria-pressed="false">Featured <span class="count"></span></button>
        <button type="button" class="view" data-view="all" aria-pressed="false">All <span class="count"></span></button>
        <button type="button" class="view" data-view="pinned" aria-pressed="false">Pinned <span class="count"></span></button>
      </div>
      <div class="tools">
        <label class="search">
          <span class="visually-hidden">Search projects</span>
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="search" placeholder="Search projects" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </label>
        <label class="sort">
          <span class="visually-hidden">Sort</span>
          <select id="sort">
            <option value="recent">Recently updated</option>
            <option value="stale">Longest untouched</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
        <div class="layouts" role="group" aria-label="Layout">
          <button type="button" class="layout" data-layout="grid" aria-pressed="true" title="Grid">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4.5 4.5h5.5v5.5H4.5zM14 4.5h5.5v5.5H14zM4.5 14h5.5v5.5H4.5zM14 14h5.5v5.5H14z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
            <span class="layout-label">Grid</span>
          </button>
          <button type="button" class="layout" data-layout="carousel" aria-pressed="false" title="Carousel">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M8 5h8a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 16 19H8a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 8 5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M3 7.5v9M21 7.5v9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            <span class="layout-label">Carousel</span>
          </button>
        </div>
      </div>
      <div class="topics" id="topics" role="group" aria-label="Filter by category"></div>
    </nav>

    <main id="main" tabindex="-1">
      <p class="status" id="status" role="status">Loading projects…</p>
      <section class="featured" id="featured-list" aria-label="Featured projects" hidden></section>
      <div class="more" id="more" hidden>
        <button type="button" class="btn btn-secondary" id="see-all" data-focus="see-all"></button>
      </div>
      <ul class="grid" id="index-list" aria-label="All projects" hidden></ul>
      <section class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Projects carousel" hidden>
        <div class="carousel-track" id="carousel-track"></div>
        <div class="carousel-nav">
          <div class="carousel-strip" id="carousel-strip" role="group" aria-label="Jump to a slide"></div>
          <p class="carousel-count" id="carousel-count"><span class="carousel-now" id="carousel-now">1</span> / <span id="carousel-total">1</span></p>
          <div class="carousel-arrows">
            <button type="button" class="round" id="carousel-prev" data-focus="carousel-prev" aria-controls="carousel-track" aria-label="Previous slide" title="Previous">
              <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="round" id="carousel-next" data-focus="carousel-next" aria-controls="carousel-track" aria-label="Next slide" title="Next">
              <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="visually-hidden" id="carousel-live" aria-live="polite" aria-atomic="true"></div>
      </section>
      <p class="hint" id="pin-hint" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Pins are saved in this browser only. Nobody else sees them.
      </p>
    </main>

    <footer class="colophon">
      <p>Rebuilt from GitHub <span id="generated"></span>.</p>
      <p><a href="https://github.com/learner-agent-sudo/portal" target="_blank" rel="noopener noreferrer">How this page works</a></p>
    </footer>
  </div>

  <div class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="status">This page needs JavaScript to list the projects.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
